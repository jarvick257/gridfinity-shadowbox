[project]
name = "gridfinity-cutter"
version = "0.1.0"
description = "Photo of an object -> outline SVG -> Gridfinity cutout STL"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-contrib-python-headless",
    "reportlab",
    "svgelements",
    "shapely",
    "trimesh",
    "mapbox-earcut",
    "manifold3d>=2.3",
]

[project.optional-dependencies]
ui = ["gradio>=6,<7"]

[project.scripts]
gridfinity-cutter = "gridfinity_cutter.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The vendored OpenSCAD library ships only its sources.
exclude = [
    "gridfinity_cutter/bins/gridfinity-rebuilt-openscad/docs",
    "gridfinity_cutter/bins/gridfinity-rebuilt-openscad/images",
    "gridfinity_cutter/bins/gridfinity-rebuilt-openscad/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["gridfinity_cutter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["gridfinity_cutter/bins/gridfinity-rebuilt-openscad"]
